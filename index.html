<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retreat Flash Talk</title>
<style>
  :root { --bg: #1c1f28; --dim: #8a8f9c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { cursor: none; }
  body.cursor { cursor: default; }
  .slide { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  .slide.on { display: flex; }
  .slide > img, .slide > video { max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 16 / 9; }
  /* movie + sharp text layer stacked in one 16:9 box */
  .stack { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  .stack > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stack > img { pointer-events: none; }   /* let the scrubber under the text layer be used */
  #hud { position: fixed; right: 14px; bottom: 10px; font: 13px/1 system-ui, sans-serif; color: var(--dim);
         opacity: 0; transition: opacity .3s; pointer-events: none; }
  body.cursor #hud { opacity: 1; }
  #help { position: fixed; left: 14px; bottom: 10px; font: 13px/1.5 system-ui, sans-serif; color: var(--dim);
          opacity: 0; transition: opacity .3s; pointer-events: none; }
  body.cursor #help { opacity: 1; }
</style>
</head>
<body>
<!-- Order: title · Detect (2DTM principle, near real-time lysate, in situ CEMOVIS) ·
     Decode (context-aware detection) · Discover / rotations -->
<div class="slide"><img src="media/01_title.png" alt="Title"></div>
<div class="slide"><div class="stack"><video src="media/02_2dtm_movie.mp4" muted playsinline preload="auto"></video><img src="media/02_2dtm_movie_text.png" alt=""></div></div>
<div class="slide"><img src="media/03_lysate_build1.png" alt="Lysate: reference"></div>
<div class="slide"><img src="media/03_lysate_build2.png" alt="Lysate: + Speed mode"></div>
<div class="slide"><img src="media/03_lysate_build3.png" alt="Lysate: + Accuracy mode"></div>
<div class="slide"><img src="media/04_cemovis_build1.png" alt="CEMOVIS: reference"></div>
<div class="slide"><img src="media/04_cemovis_build2.png" alt="CEMOVIS: + fast 2DTM"></div>
<div class="slide"><img src="media/06_context.png" alt="Context-aware detection"></div>
<div class="slide"><img src="media/07_closing.png" alt="Rotations"></div>
<div id="hud"></div>
<div id="help">→ / space / click: next · ← back · F fullscreen · movie: K pause · J/L ∓3 s · R restart · Home/End</div>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  const hud = document.getElementById('hud');
  let i = 0;
  try { i = Math.min(+(location.hash.slice(1) || 1) - 1, slides.length - 1) || 0; } catch (e) {}

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => {
      s.classList.toggle('on', k === i);
      const v = s.querySelector('video');
      if (!v) return;
      if (k === i) { v.currentTime = 0; v.play().catch(() => {}); } else { v.pause(); }
    });
    hud.textContent = (i + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (i + 1));
  }

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n'].includes(k)) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p'].includes(k)) { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    } else {
      const v = slides[i].querySelector('video');
      if (!v) return;
      if (k === 'r' || k === 'R') { v.currentTime = 0; v.play(); }
      else if (k === 'k' || k === 'K') { v.paused ? v.play() : v.pause(); }
      else if (k === 'j' || k === 'J') { v.currentTime = Math.max(0, v.currentTime - 3); }
      else if (k === 'l' || k === 'L') { v.currentTime = Math.min(v.duration, v.currentTime + 3); }
    }
  });
  document.addEventListener('click', e => {
    if (e.target.tagName === 'VIDEO') return;          // clicks on the scrubber stay on the movie
    show(e.clientX < innerWidth / 5 ? i - 1 : i + 1);
  });
  let t;
  document.addEventListener('mousemove', () => {
    document.body.classList.add('cursor'); clearTimeout(t);
    document.querySelectorAll('video').forEach(v => v.controls = true);
    t = setTimeout(() => {
      document.body.classList.remove('cursor');
      document.querySelectorAll('video').forEach(v => v.controls = false);
    }, 1500);
  });
  show(i);
</script>
</body>
</html>
